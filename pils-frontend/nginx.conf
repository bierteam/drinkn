worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # vite writes content-hashed filenames into /assets, so those are safe to
    # keep forever. index.html must not be cached or clients would pin to an
    # old bundle. resolved via map so a single server-level add_header covers
    # every location -- an add_header inside a location would drop the
    # inherited security headers below.
    map $uri $cache_control {
        default                                   "no-cache";
        ~^/assets/                                "public, max-age=31536000, immutable";
        ~*\.(?:ico|png|svg|jpe?g|gif|woff2?)$     "public, max-age=2592000";
    }

    server {
        listen       8080;
        server_name  localhost;
        root         /usr/share/nginx/html;

        add_header Cache-Control          $cache_control                 always;
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # no Content-Security-Policy yet: browser-update and the pwned-password
        # lookup both reach off-origin, so a policy needs those origins pinned
        # down first and verifying in a browser.

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
