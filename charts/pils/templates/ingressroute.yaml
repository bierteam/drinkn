---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: drinkn
  annotations:
    link.argocd.argoproj.io/external-link: 'https://{{ .Values.fqdn }}'
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.fqdn }}`)
      kind: Rule
      services:
        - name: pils-frontend
          port: 80
    - match: Host(`{{ .Values.fqdn }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: pils-backend
          port: 80
