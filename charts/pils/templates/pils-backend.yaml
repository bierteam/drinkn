---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pils-backend
  name: pils-backend
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: pils-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pils-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/bierteam/drinkn/pils-backend:{{ .Values.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            # writes nothing to disk: config in, mongo out
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          envFrom:
            - secretRef:
                name: drinkn-env
                optional: false
          imagePullPolicy: Always
          name: pils-backend
          resources:
            requests:
              {{- toYaml .Values.resources.pilsBackend.requests | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pils-backend
spec:
  selector:
    app: pils-backend
  ports:
    - port: 80
      name: default
      protocol: TCP
      targetPort: 3000
