---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pils-backend
  name: pils-backend
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: pils-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pils-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/bierteam/drinkn/pils-backend:{{ .Values.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            # writes nothing to disk: config in, mongo out
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          env:
            # passkeys are bound to the exact domain, so pin rather than infer
            - name: RP_ID
              value: {{ .Values.fqdn | quote }}
            - name: RP_ORIGIN
              value: https://{{ .Values.fqdn }}
            {{- if and .Values.oidc.issuer (not .Values.pr.enabled) }}
            # single sign-on. A preview namespace has an fqdn dex was never
            # told about and would have its callback refused, so it gets none
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_NAME
              value: {{ .Values.oidc.name | quote }}
            {{- if .Values.oidc.adminGroup }}
            - name: OIDC_ADMIN_GROUP
              value: {{ .Values.oidc.adminGroup | quote }}
            {{- end }}
            - name: OIDC_ALLOW_SIGNUP
              value: {{ .Values.oidc.allowSignup | quote }}
            - name: OIDC_LINK_BY_USERNAME
              value: {{ .Values.oidc.linkByUsername | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: drinkn-env
                optional: false
          imagePullPolicy: Always
          name: pils-backend
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              {{- toYaml .Values.resources.pilsBackend.requests | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pils-backend
spec:
  selector:
    app: pils-backend
  ports:
    - port: 80
      name: default
      protocol: TCP
      targetPort: 3000
