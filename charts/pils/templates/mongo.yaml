{{- if .Values.pr.enabled }}
# https://github.com/bitnami/containers/tree/main/bitnami/mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  replicas: 1
  serviceName: mongodb
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: bitnamilegacy/mongodb:4.4.15
          ports:
            - containerPort: 27017
          env:
            - name: MONGODB_ENABLE_IPV6
              value: "true"
            - name: ALLOW_EMPTY_PASSWORD
              value: "true"
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef: 
                  name: drinkn-env
                  key: DB_NAME
          volumeMounts:
            - name: mongo-storage
              mountPath: /bitnami/mongodb
            - name: import-volume
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mongo", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: import-volume
          configMap:
            name: import-volume
  volumeClaimTemplates:
    - metadata:
        name: mongo-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: import-volume
data:
  import.sh: |
    #!/bin/bash
    mongoimport --host localhost --db $MONGODB_DATABASE --collection beers --file /docker-entrypoint-initdb.d/beers.json --jsonArray
    mongoimport --host localhost --db $MONGODB_DATABASE --collection stores --file /docker-entrypoint-initdb.d/stores.json --jsonArray
    # the new collection: 72 real Albert Heijn records and the 60 legacy
    # biernet rows put through migrations/001, so a preview shows both sources
    mongoimport --host localhost --db $MONGODB_DATABASE --collection products --file /docker-entrypoint-initdb.d/products.json --jsonArray
