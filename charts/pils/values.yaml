# Default values for drinkn.
image:
  tag: "sha-ad80380"

replicas: "2"

fqdn: pils.oscarr.nl

# single sign-on through dex, as a public client with PKCE: no secret, so
# nothing here has to be sealed. Dex matches redirect uris exactly and has no
# wildcards, so only this fqdn is registered -- preview namespaces below get
# the password login and their throwaway account instead.
oidc:
  issuer: https://auth.oscarr.nl
  clientId: pils
  # what the login button offers to sign in with
  name: auth.oscarr.nl
  # a value from the groups claim whose members are admins here. Empty leaves
  # admin to whatever the account already holds
  adminGroup: ""
  # false lets only subjects that already have an account here sign in
  allowSignup: true
  # a first federated sign-in never claims the local account that happens to
  # share its username: dex usernames come from the connector and are not this
  # site's to vouch for, so a match is a refusal rather than a handover
  linkByUsername: false

pr:
  enabled: false
  number: 9999
  ref: main
  # hold the sync until this revision's images exist; the build mostly queues
  waitForImages:
    timeoutSeconds: 1200
    pollSeconds: 15
    images:
      - pils-backend
      - pils-frontend
  status:
    - PreSync
    - PostSync
    - SyncFail
    - PostDelete

# Requests only, deliberately no memory limits: requests give the scheduler
# something to reserve and lift these pods out of BestEffort, where they are
# first to be evicted under node pressure. A memory limit would instead get
# the container OOM-killed the moment it exceeded the number, which is the
# trade we are not making here.
#
# Sized from observed usage (kubectl top) with headroom:
#   pils 50Mi, pils-frontend 6-8Mi
resources:
  pilsBackend:
    requests:
      cpu: 25m
      memory: 128Mi
      ephemeral-storage: 128Mi
  pilsFrontend:
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 64Mi
  githubWebhooks:
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 64Mi
  # Unlike the numbers above, this one is not sized from observed usage -- the
  # job had no requests at all before, so there is nothing to have observed. It
  # holds a whole biernet join and the ~900-product AH assortment in memory at
  # once, so it starts level with pilsBackend rather than lower. Worth replacing
  # with a real figure from `kubectl top pod` after a few live runs: too low is
  # not an OOM here (there is no limit) but it does make the pod a candidate for
  # eviction, which is the thing these requests exist to avoid.
  discountsImport:
    requests:
      cpu: 25m
      memory: 128Mi
      ephemeral-storage: 128Mi
