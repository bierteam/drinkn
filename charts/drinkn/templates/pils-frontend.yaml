---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pils-frontend
  name: pils-frontend
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: pils-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pils-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # emptyDir ownership follows fsGroup, so the mounts below are writable
        # by the container without pinning its uid
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # the only two paths nginx writes to: its temp directories, and the
        # pid file (relocated to /tmp for exactly this reason)
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - image: ghcr.io/bierteam/drinkn/pils-frontend:{{ .Values.image.tag }}
          imagePullPolicy: Always
          name: pils-frontend
          resources:
            requests:
              {{- toYaml .Values.resources.pilsFrontend.requests | nindent 14 }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # the unprivileged image needs none of these: it starts as 101 and
            # listens on 8080, so there is nothing to chown and no low port
            capabilities:
              drop:
                - "ALL"
---
apiVersion: v1
kind: Service
metadata:
  name: pils-frontend
spec:
  selector:
    app: pils-frontend
  ports:
    - port: 80
      name: default
      protocol: TCP
      targetPort: 8080
