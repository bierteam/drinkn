{{- if not .Values.pr.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: drinkn-auth
  name: drinkn-auth
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: drinkn-auth
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: drinkn-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        # runAsNonRoot: true #TODO
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: bierteam/auth
          envFrom:
            - secretRef:
                name: drinkn-env
                optional: false
          imagePullPolicy: Always
          name: drinkn-auth
          resources:
            requests:
              {{- toYaml .Values.resources.auth.requests | nindent 14 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
---
apiVersion: v1
kind: Service
metadata:
  name: drinkn-auth
spec:
  selector:
    app: drinkn-auth
  ports:
    - port: 80
      name: default
      protocol: TCP
      targetPort: 3000
{{- end }}
