
name: Repository Dispatch
on:
  repository_dispatch:
    types:
      - PreSync
      - PostSync
      - SyncFail
      - PostDelete

permissions:
  deployments: write

# the client payload is caller-written, so its values go through env
jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Find deployment ID
        id: find-deployment
        env:
          REF: ${{ github.event.client_payload.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments" \
            | jq -r --arg ref "$REF" '.[] | select(.ref == $ref) | .id' | head -n 1)

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Check if deployment ID was found
        id: check-deployment
        env:
          DEPLOYMENT_ID: ${{ steps.find-deployment.outputs.DEPLOYMENT_ID }}
          REF: ${{ github.event.client_payload.ref }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "No deployment found for ref: $REF"
            echo "DEPLOYMENT_FOUND=false" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOYMENT_FOUND=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update deployment status
        if: ${{ steps.check-deployment.outputs.DEPLOYMENT_FOUND == 'true' }}
        env:
          DEPLOYMENT_ID: ${{ steps.find-deployment.outputs.DEPLOYMENT_ID }}
          ACTION: ${{ github.event.action }}
          LOG_URL: ${{ github.event.client_payload.log_url }}
          ENVIRONMENT_URL: ${{ github.event.client_payload.environment_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ACTION" in
            PreSync)
              STATUS="in_progress"
              DESCRIPTION="Deployment is in progress (PreSync)"
              ;;
            PostSync)
              STATUS="success"
              DESCRIPTION="Deployment succeeded (PostSync)"
              ;;
            SyncFail)
              STATUS="failure"
              DESCRIPTION="Deployment failed (SyncFail)"
              ;;
            PostDelete)
              STATUS="inactive"
              DESCRIPTION="Deployment is inactive (PostDelete)"
              ;;
            *)
              echo "Unsupported event type: $ACTION"
              exit 1
              ;;
          esac

          jq -n \
            --arg state "$STATUS" \
            --arg description "$DESCRIPTION" \
            --arg log_url "$LOG_URL" \
            --arg environment_url "$ENVIRONMENT_URL" \
            '{state: $state, description: $description, log_url: $log_url, environment_url: $environment_url}' \
          | curl -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @-
